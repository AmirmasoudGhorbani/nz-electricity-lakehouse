resources:
  jobs:
    nz_electricity_pipeline:
      name: nz-electricity-pipeline
      description: Bronze -> silver -> gold for NZ wholesale electricity prices and hydro storage.
      # Runs automatically when a new file lands in the prices folder of the volume
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/raw/prices/
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/notebooks/01_bronze.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ../src/notebooks/02_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../src/notebooks/03_gold.py
